<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <!-- The web build's title, description, canonical link and link preview (CLAUDE.md, "Search and link previews"),
         so search engines and link previews see more than an empty page. Expo's own template (@expo/cli's
         static/template/index.html) with these added: `single` output writes this one page for every route, so they're
         written here rather than in a route's generateMetadata(). Name first, as the packs' titles read. -->
    <title>AlphaTastic | Infinite Token Games</title>
    <meta name="description" content="Hangman, Word Search, Jumble and Cryptogram, with 19k+ puzzles across 50+ packs from Countries to Movies, and Pass &amp; Play with friends. Free in your browser with no ads." />
    <link rel="canonical" href="https://games.infinitetoken.com/alphatastic/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Infinite Token Games" />
    <meta property="og:title" content="AlphaTastic | Infinite Token Games" />
    <meta property="og:description" content="Hangman, Word Search, Jumble and Cryptogram, with 19k+ puzzles across 50+ packs from Countries to Movies, and Pass &amp; Play with friends. Free in your browser with no ads." />
    <meta property="og:url" content="https://games.infinitetoken.com/alphatastic/" />
    <!-- Games-Web's link preview card, which every page there shares -->
    <meta property="og:image" content="https://games.infinitetoken.com/images/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="AlphaTastic | Infinite Token Games" />
    <meta name="twitter:description" content="Hangman, Word Search, Jumble and Cryptogram, with 19k+ puzzles across 50+ packs from Countries to Movies, and Pass &amp; Play with friends. Free in your browser with no ads." />
    <meta name="twitter:image" content="https://games.infinitetoken.com/images/og.png" />
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript> You need to enable JavaScript to run this app. </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
